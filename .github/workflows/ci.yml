name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Native process discovery and Gateway contract tests
        run: node --import tsx --test --test-isolation=none packages/adapters/src/process-discovery.test.ts src/process-discovery.test.ts
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Console dependencies
        run: npm ci --prefix apps/web
      - name: Typecheck source and tests
        run: npm run typecheck
      - name: Run all tests, including Gateway HTTP integration
        run: npm test
      - name: Build backend and Console
        run: npm run build
      - name: Test Console supervision workflows
        run: npm --prefix apps/web test
